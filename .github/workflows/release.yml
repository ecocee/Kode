name: Kode Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag (example: v0.3.6)"
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Check the tag matches the version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare the tag's Cargo.toml with the tag
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null; then
            echo "ERROR: there is no tag ${TAG} in this repository."
            echo "Recent tags:"
            git tag --list 'v*' --sort=-v:refname | head -n 10 | sed 's/^/  /'
            exit 1
          fi
          want="${TAG#v}"
          have="$(git show "${TAG}:Cargo.toml" | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)"
          if [ -z "${have}" ]; then
            echo "ERROR: ${TAG}:Cargo.toml has no version line"
            exit 1
          fi
          # A tag may carry a suffix of its own (v0.3.4-test), so the version in
          # the tree has to be the tag's version or its leading part.
          case "${want}" in
            "${have}"|"${have}"-*)
              echo "tag ${TAG} matches Cargo.toml ${have}"
              ;;
            *)
              echo "ERROR: tag ${TAG} points at a commit whose Cargo.toml says ${have}."
              echo "Release the commit that carries the version:"
              echo "  git tag -f ${TAG} <commit> && git push --force origin ${TAG}"
              echo "or bump the version and tag that instead."
              exit 1
              ;;
          esac

  linux:
    needs: verify
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check project
        run: cargo check --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release --workspace

      - name: Smoke test the built compiler
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/release/kode
          "$BIN" doctor
          "$BIN" --version
          VERSION="${TAG#v}"
          "$BIN" --version | grep -qF "$VERSION" || {
            echo "ERROR: the binary does not report $VERSION (tag $TAG)"
            exit 1
          }
          printf 'print("hello")\n' > /tmp/hello.kode
          test "$("$BIN" run /tmp/hello.kode)" = "hello"

      - name: Prepare release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$TAG"
          mkdir -p dist
          cp target/release/kode dist/kode
          chmod 755 dist/kode
          for f in README.md CHANGELOG.md LICENSE; do
            [ ! -f "$f" ] || cp "$f" dist/
          done
          tar -czf "kode-${VERSION}-linux-x86_64.tar.gz" -C dist .

      - name: Create DEB package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"   # dpkg version strings start with a digit
          FILE_VERSION="$TAG"  # artifact names follow the tag, like the tarball
          ROOT="pkg/kode_${VERSION}_amd64"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/usr/share/doc/kode"
          cp dist/kode "$ROOT/usr/bin/kode"
          chmod 755 "$ROOT/usr/bin/kode"
          for f in README.md CHANGELOG.md LICENSE; do
            [ ! -f "$f" ] || cp "$f" "$ROOT/usr/share/doc/kode/"
          done
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: kode
          Version: $VERSION
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: ECOCEE <ecoceeteam@gmail.com>
          Description: Kode programming language compiler
           Kode compiles programs to native machine code.
          EOF
          dpkg-deb --root-owner-group --build "$ROOT" "kode-${FILE_VERSION}-linux-x86_64.deb"
          dpkg-deb --info "kode-${FILE_VERSION}-linux-x86_64.deb"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$TAG"
          sha256sum "kode-${VERSION}-linux-x86_64.tar.gz" "kode-${VERSION}-linux-x86_64.deb" > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            kode-*-linux-x86_64.tar.gz
            kode-*-linux-x86_64.deb
            SHA256SUMS-linux.txt

  macos:
    needs: verify
    name: Build macOS arm64
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace
        env:
          KODE_LEAK_CHECK: "1"

      - name: Build release
        run: cargo build --release --workspace

      - name: Smoke test the built compiler
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/release/kode
          "$BIN" doctor
          "$BIN" --version
          VERSION="${TAG#v}"
          "$BIN" --version | grep -qF "$VERSION" || {
            echo "ERROR: the binary does not report $VERSION (tag $TAG)"
            exit 1
          }
          printf 'print("hello")\n' > /tmp/hello.kode
          test "$("$BIN" run /tmp/hello.kode)" = "hello"

      - name: Prepare release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$TAG"
          mkdir -p dist
          cp target/release/kode dist/kode
          chmod 755 dist/kode
          for f in README.md CHANGELOG.md LICENSE; do
            [ ! -f "$f" ] || cp "$f" dist/
          done
          tar -czf "kode-${VERSION}-macos-arm64.tar.gz" -C dist .

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$TAG"
          shasum -a 256 "kode-${VERSION}-macos-arm64.tar.gz" > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            kode-*-macos-arm64.tar.gz
            SHA256SUMS-macos.txt

  windows:
    needs: verify
    name: Build Windows x86_64
    runs-on: windows-latest
    env:
      MSYSTEM: UCRT64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Install Rust (GNU toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install clang
        run: choco install llvm -y --no-progress

      - name: Install MinGW-w64 (GCC for Windows)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Check project
        run: cargo check --workspace

      - name: Run tests
        run: cargo test --workspace
        env:
          KODE_LEAK_CHECK: "1"

      - name: Build release
        run: cargo build --release --workspace

      - name: Smoke test the built compiler
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/release/kode
          "$BIN" doctor
          "$BIN" --version
          VERSION="${TAG#v}"
          "$BIN" --version | grep -qF "$VERSION" || {
            echo "ERROR: the binary does not report $VERSION (tag $TAG)"
            exit 1
          }
          printf 'print("hello")\n' > /tmp/hello.kode
          test "$("$BIN" run /tmp/hello.kode)" = "hello"

      - name: Prepare release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$TAG"
          mkdir -p dist
          cp target/release/kode dist/kode
          chmod 755 dist/kode
          for f in README.md CHANGELOG.md LICENSE; do
            [ ! -f "$f" ] || cp "$f" dist/
          done
          tar -czf "kode-${VERSION}-windows-x86_64.tar.gz" -C dist .

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$TAG"
          sha256sum "kode-${VERSION}-windows-x86_64.tar.gz" > SHA256SUMS-windows.txt
          cat SHA256SUMS-windows.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            kode-*-windows-x86_64.tar.gz
            SHA256SUMS-windows.txt

  publish:
    name: Publish GitHub Release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Merge checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          ls -l
          cat SHA256SUMS-linux.txt SHA256SUMS-macos.txt SHA256SUMS-windows.txt | sort -k 2 > SHA256SUMS.txt
          rm SHA256SUMS-linux.txt SHA256SUMS-macos.txt SHA256SUMS-windows.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Kode ${{ env.TAG }}
          generate_release_notes: true
          files: |
            artifacts/kode-*-linux-x86_64.tar.gz
            artifacts/kode-*-linux-x86_64.deb
            artifacts/kode-*-macos-arm64.tar.gz
            artifacts/kode-*-windows-x86_64.tar.gz
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
