name: release

on:
  push:
    tags: ["v*"]
  # Run it by hand to rebuild the artifacts of an existing tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      # `kode` links its programs with MinGW-w64, so cargo has to use it too.
      - name: Point cargo at MinGW-w64
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=gcc" >> "$GITHUB_ENV"

      - name: Build the compiler
        shell: bash
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Stage files
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          version="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.tag }}" ]; then version="${{ inputs.tag }}"; version="${version#v}"; fi
          echo "KODE_VERSION=$version" >> "$GITHUB_ENV"
          bin="target/${{ matrix.target }}/release/kode${ext}"
          "$bin" --version
          mkdir -p dist
          cp "$bin" "dist/kode${ext}"
          cp README.md CHANGELOG.md dist/ 2>/dev/null || true
          cp docs/editors.md docs/windows.md dist/ 2>/dev/null || true

      - name: Tarball (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "kode-$KODE_VERSION-${{ matrix.name }}.tar.gz" -C dist .

      - name: Zip and console binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && 7z a "../kode-$KODE_VERSION-${{ matrix.name }}.zip" .)
          cp "dist/kode.exe" "kode-$KODE_VERSION-${{ matrix.name }}.exe"

      - name: Debian package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-*) arch=amd64 ;;
            aarch64-*) arch=arm64 ;;
            *) echo "unsupported target ${{ matrix.target }}"; exit 1 ;;
          esac
          root="pkg/kode_${KODE_VERSION}_${arch}"
          mkdir -p "$root/DEBIAN" "$root/usr/bin" "$root/usr/share/doc/kode"
          cp dist/kode "$root/usr/bin/kode"
          cp README.md CHANGELOG.md "$root/usr/share/doc/kode/" 2>/dev/null || true
          cat > "$root/DEBIAN/control" <<EOF
          Package: kode
          Version: $KODE_VERSION
          Section: devel
          Priority: optional
          Architecture: $arch
          Maintainer: ECOCEE <ecoceeteam@gmail.com>
          Description: A compiled language with its own native backend.
           Kode compiles to machine code through Cranelift and links with the
           system C toolchain. This package installs the \`kode\` compiler and
           the runtime it embeds.
          EOF
          deb="kode-${KODE_VERSION}-${{ matrix.name }}.deb"
          dpkg-deb --root-owner-group --build "$root" "$deb"
          rm -rf pkg
          dpkg-deb --info "$deb"

      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          hdiutil create -quiet -volname "Kode $KODE_VERSION" \
            -srcfolder dist -ov -format UDZO \
            "kode-$KODE_VERSION-${{ matrix.name }}.dmg"

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null; then sum=(sha256sum); else sum=(shasum -a 256); fi
          for f in kode-*; do "${sum[@]}" "$f"; done > "SHA256SUMS-${{ matrix.name }}.txt"
          cat "SHA256SUMS-${{ matrix.name }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: kode-${{ matrix.name }}
          path: |
            kode-*
            SHA256SUMS-*.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Combine checksums
        run: |
          set -euo pipefail
          cat artifacts/SHA256SUMS-*.txt | sort -k2 > artifacts/SHA256SUMS.txt
          rm artifacts/SHA256SUMS-*.txt
          cat artifacts/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          body_path: CHANGELOG.md
