name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p kode
      - run: tar -czf kode-${{ matrix.os }}.tar.gz -C target/release kode
      - uses: softprops/action-gh-release@v2
        with:
          files: kode-${{ matrix.os }}.tar.gz
