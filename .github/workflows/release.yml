
name: Kode Linux Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag (example: v0.3.5)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build Linux x86_64
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      # 2. Install Rust
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 3. Rust cache
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      # 4. Verify project
      - name: Check project
        run: cargo check --workspace

      # 5. Run tests
      - name: Run tests
        run: cargo test --workspace

      # 6. Build Linux binary
      - name: Build release
        run: cargo build --release --workspace

      # 7. Prepare release files
      - name: Prepare release
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          BIN="target/release/kode"

          if [ ! -f "$BIN" ]; then
            echo "ERROR: Kode binary not found!"
            echo "Checking generated binaries:"
            find target/release -maxdepth 1 -type f -executable
            exit 1
          fi

          "$BIN" --version

          mkdir -p dist

          cp "$BIN" dist/kode
          chmod 755 dist/kode

          [ ! -f README.md ] || cp README.md dist/
          [ ! -f CHANGELOG.md ] || cp CHANGELOG.md dist/

      # 8. Create Linux tarball
      - name: Create tarball
        run: |
          tar -czf "kode-${VERSION}-linux-x86_64.tar.gz" -C dist .

      # 9. Create Debian package
      - name: Create DEB package
        shell: bash
        run: |
          set -euo pipefail

          ROOT="pkg/kode_${VERSION}_amd64"

          mkdir -p "$ROOT/DEBIAN"
          mkdir -p "$ROOT/usr/bin"
          mkdir -p "$ROOT/usr/share/doc/kode"

          cp dist/kode "$ROOT/usr/bin/kode"
          chmod 755 "$ROOT/usr/bin/kode"

          [ ! -f README.md ] || \
            cp README.md "$ROOT/usr/share/doc/kode/"

          [ ! -f CHANGELOG.md ] || \
            cp CHANGELOG.md "$ROOT/usr/share/doc/kode/"

          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: kode
          Version: $VERSION
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: ECOCEE <ecoceeteam@gmail.com>
          Description: Kode programming language compiler
           Kode compiles programs to native machine code.
          EOF

          dpkg-deb --root-owner-group --build \
            "$ROOT" \
            "kode-${VERSION}-linux-x86_64.deb"

          dpkg-deb --info "kode-${VERSION}-linux-x86_64.deb"

      # 10. Generate SHA256 checksums
      - name: Generate checksums
        run: |
          sha256sum \
            "kode-${VERSION}-linux-x86_64.tar.gz" \
            "kode-${VERSION}-linux-x86_64.deb" \
            > SHA256SUMS.txt

          cat SHA256SUMS.txt

      # 11. Publish GitHub Release
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Kode v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            kode-${{ env.VERSION }}-linux-x86_64.tar.gz
            kode-${{ env.VERSION }}-linux-x86_64.deb
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
