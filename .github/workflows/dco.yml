name: dco

# Every commit in a pull request must carry a Developer Certificate of Origin
# sign-off; CONTRIBUTING.md explains why and how. Merge commits are skipped:
# they are written by GitHub, not by the contributor, and the commits they merge
# are checked individually.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  signoff:
    name: commits are signed off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on every commit
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          base="origin/${BASE_REF}"
          range="${base}..${HEAD_SHA}"
          missing=0
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            message="$(git log -1 --format=%B "$sha")"
            if ! printf '%s\n' "$message" \
                | grep -qiE '^Signed-off-by: [^<]+ <[^@>]+@[^>]+>$'; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") has no Signed-off-by line"
              missing=1
              continue
            fi
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if ! printf '%s\n' "$message" | grep -qiF "Signed-off-by: ${author}"; then
              echo "::warning::$(git log -1 --format=%h "$sha") is signed off by someone other than its author (${author})"
            fi
          done < <(git rev-list --no-merges "$range")
          if [ "$missing" -ne 0 ]; then
            echo "Add the line with: git commit --amend -s --no-edit"
            echo "For a branch of several commits: git rebase --signoff ${base}"
            exit 1
          fi
          echo "Every commit in ${range} is signed off."
