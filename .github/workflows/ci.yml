name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Windows links through MinGW-w64 (`gcc`), which the runner does not ship.
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      # Build with the GNU toolchain, the one `kode` links through. An MSVC
      # toolchain would embed a runtime MinGW cannot link (`__chkstk`,
      # `__CxxFrameHandler3`).
      - name: Use MinGW-w64 as the Rust toolchain on Windows
        if: runner.os == 'Windows'
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      - name: Build
        run: cargo build --workspace

      - name: Test (with leak checks)
        run: cargo test --workspace
        env:
          KODE_LEAK_CHECK: "1"

      - name: Conformance smoke test
        shell: bash
        run: |
          ./target/debug/kode check tests/run-pass/finally.kode
          ./target/debug/kode run tests/run-pass/bool_lists.kode > /tmp/out.txt
          diff tests/run-pass/bool_lists.out /tmp/out.txt

      - name: Formatting is a no-op
        shell: bash
        run: ./target/debug/kode fmt tests/run-pass examples --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings
