[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.6"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/ecocee/Kode"

# One place for every dependency version.
[workspace.dependencies]
kode-diagnostics = { path = "crates/kode-diagnostics" }
kode-syntax = { path = "crates/kode-syntax" }
kode-sema = { path = "crates/kode-sema" }
kode-mir = { path = "crates/kode-mir" }
kode-link = { path = "crates/kode-link" }
kode-llvm = { path = "crates/kode-llvm" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# `kode-rt` is a *build* dependency of `kode-cli`: the compiler embeds the archive its
# build script finds. Build dependencies do not inherit `[profile.release]`, so without
# this they are compiled unoptimized, the compiler embeds a 22.8 MB runtime instead of a
# 12.5 MB one, and every Kode program grows by ~281 KB when stripped
# (hello world: 983,376 -> 1,264,808 bytes).
[profile.release.build-override]
opt-level = 3
codegen-units = 1