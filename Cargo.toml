[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/ecocee/Kode"

# One place for every dependency version. Upgrade Cranelift here only.
[workspace.dependencies]
cranelift-codegen = "0.130"
cranelift-frontend = "0.130"
cranelift-module = "0.130"
cranelift-object = "0.130"
cranelift-native = "0.130"
kode-diagnostics = { path = "crates/kode-diagnostics" }
kode-syntax = { path = "crates/kode-syntax" }
kode-sema = { path = "crates/kode-sema" }
kode-mir = { path = "crates/kode-mir" }
kode-codegen = { path = "crates/kode-codegen" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true