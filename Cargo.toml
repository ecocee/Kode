[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.5"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/ecocee/Kode"

# One place for every dependency version.
[workspace.dependencies]
kode-diagnostics = { path = "crates/kode-diagnostics" }
kode-syntax = { path = "crates/kode-syntax" }
kode-sema = { path = "crates/kode-sema" }
kode-mir = { path = "crates/kode-mir" }
kode-link = { path = "crates/kode-link" }
kode-llvm = { path = "crates/kode-llvm" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true